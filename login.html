        <div class="login-card">
            <img src="/assets/larsil-logo.png" alt="Larsil Serviços Florestais" class="login-logo">

            <form id="loginForm" novalidate>
                <div class="login-field">
                    <label class="login-label" for="login">Usuário</label>
                    <div class="login-input-row">
                        <input
                            id="login"
                            class="login-input"
                            placeholder="joao.silva"
                            autocomplete="username"
                            autocapitalize="none"
                            autocorrect="off"
                            spellcheck="false"
                            autofocus>
                        <!-- avatar entra aqui enquanto a pessoa digita -->
                        <div id="avatarSlot"></div>
                    </div>
                </div>

                <div class="login-field">
                    <label class="login-label" for="senha">Senha</label>
                    <div class="login-input-row" style="position: relative;">
                        <input
                            id="senha"
                            class="login-input"
                            type="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            style="padding-right: 40px;">
                        <button type="button" id="togglePwd" class="login-pwd-toggle" tabindex="-1" aria-label="Mostrar senha">👁</button>
                    </div>
                </div>

                <div id="erroBox" class="login-error" style="display: none;"></div>

                <button type="submit" id="btnEntrar" class="login-submit">
                    <span id="btnIcone">→</span>
                    <span id="btnTexto">Entrar</span>
                </button>
            </form>

            <div class="login-footer">
                Larsil Serviços Florestais<br>
                Identidade única — <a href="https://painelgestor.up.railway.app" target="_blank" rel="noopener">IAM Larsil</a>
            </div>
        </div>

    <script>
        // ==========================================
        // Config pública (URL das fotos, servida pelo PCP)
        // ==========================================
        let FOTO_BASE = '';
        fetch(`${SESSION.API_BASE_URL}/api/config`)
            .then(r => r.ok ? r.json() : null)
            .then(c => { if (c) FOTO_BASE = c.fotoBaseUrl; })
            .catch(() => {});

        // Já logado? vai direto pro sistema
        if (SESSION.getJwt() && SESSION.sessaoValida()) {
            window.location.href = '/index.html';
        }

        const form = document.getElementById('loginForm');
        const inputLogin = document.getElementById('login');
        const inputSenha = document.getElementById('senha');
        const erroBox = document.getElementById('erroBox');
        const btn = document.getElementById('btnEntrar');
        const btnIcone = document.getElementById('btnIcone');
        const btnTexto = document.getElementById('btnTexto');
        const avatarSlot = document.getElementById('avatarSlot');

        // ==========================================
        // AVATAR ENQUANTO DIGITA
        //
        // O login é "nome.sobrenome", mas a foto é resolvida por NOME COMPLETO.
        // Guardamos login -> nome real após o 1º login bem-sucedido; a partir da
        // 2ª vez a foto certa aparece instantânea. Sem cache, chutamos o nome a
        // partir do login ("rodrigo.dlugosz" -> "Rodrigo Dlugosz") — o resolvedor
        // do PCP normaliza e costuma acertar mesmo com o chute.
        // ==========================================
        const NOME_CACHE_KEY = 'larsil_nome_cache';

        function lerNomeCache(login) {
            try {
                return JSON.parse(localStorage.getItem(NOME_CACHE_KEY) || '{}')[login.toLowerCase()] || null;
            } catch { return null; }
        }

        function salvarNomeCache(login, nome) {
            try {
                const cache = JSON.parse(localStorage.getItem(NOME_CACHE_KEY) || '{}');
                cache[login.toLowerCase()] = nome;
                localStorage.setItem(NOME_CACHE_KEY, JSON.stringify(cache));
            } catch { /* best-effort */ }
        }

        function nomeAdivinhado(login) {
            return login.replace(/[._]+/g, ' ').trim().split(/\s+/).filter(Boolean)
                .map(p => p[0].toUpperCase() + p.slice(1).toLowerCase()).join(' ');
        }

        function iniciais(nome) {
            return nome.trim().split(/\s+/).map(s => s[0]).slice(0, 2).join('').toUpperCase();
        }

        let nomePreview = '';
        function renderAvatar(nome) {
            if (!nome || !FOTO_BASE) { avatarSlot.replaceChildren(); return; }
            if (nome === nomePreview) return;   // não repinta (reinicia a animação à toa)
            nomePreview = nome;

            const box = document.createElement('div');
            box.className = 'login-avatar-preview';

            const img = document.createElement('img');
            img.alt = '';
            img.referrerPolicy = 'no-referrer';
            img.src = `${FOTO_BASE}/${encodeURIComponent(nome)}`;
            // Sem foto -> iniciais
            img.onerror = () => {
                box.replaceChildren();
                const span = document.createElement('span');
                span.textContent = iniciais(nome);
                box.appendChild(span);
            };

            box.appendChild(img);
            avatarSlot.replaceChildren(box);
        }

        let debounceAvatar;
        inputLogin.addEventListener('input', () => {
            esconderErro();
            clearTimeout(debounceAvatar);
            const l = inputLogin.value.trim();
            if (l.length < 3) { avatarSlot.replaceChildren(); nomePreview = ''; return; }
            debounceAvatar = setTimeout(() => renderAvatar(lerNomeCache(l) || nomeAdivinhado(l)), 300);
        });

        inputSenha.addEventListener('input', esconderErro);

        // ==========================================
        // MOSTRAR/ESCONDER SENHA
        // ==========================================
        document.getElementById('togglePwd').addEventListener('click', () => {
            const mostrando = inputSenha.type === 'text';
            inputSenha.type = mostrando ? 'password' : 'text';
            document.getElementById('togglePwd').textContent = mostrando ? '👁' : '🙈';
        });

        function mostrarErro(msg) {
            erroBox.textContent = msg;
            erroBox.style.display = 'block';
        }
        function esconderErro() { erroBox.style.display = 'none'; }

        function carregando(sim) {
            btn.disabled = sim;
            inputLogin.disabled = sim;
            inputSenha.disabled = sim;
            btnTexto.textContent = sim ? 'Entrando…' : 'Entrar';
            if (sim) {
                btnIcone.className = 'login-spinner';
                btnIcone.textContent = '';
            } else {
                btnIcone.className = '';
                btnIcone.textContent = '→';
            }
        }

        // ==========================================
        // LOGIN (via IAM, pelo nosso backend)
        // ==========================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const login = inputLogin.value.trim();
            const senha = inputSenha.value;

            if (!login || !senha) { mostrarErro('Preencha usuário e senha.'); return; }

            esconderErro();
            carregando(true);

            try {
                const response = await fetch(`${SESSION.API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, senha })
                });

                const dados = await response.json().catch(() => ({}));

                if (!response.ok) {
                    carregando(false);
                    inputSenha.value = '';
                    mostrarErro(dados.error || 'Usuário ou senha inválidos.');
                    return;
                }

                SESSION.salvarSessao(dados);
                if (dados.user?.nome) salvarNomeCache(login, dados.user.nome);

                // 1º acesso: precisa trocar a senha provisória antes de entrar
                if (dados.senha_provisoria) {
                    window.location.href = '/primeiro-acesso.html';
                    return;
                }

                // Overlay cobre a transição até o painel carregar
                mostrarOverlayEntrada(() => { window.location.href = '/index.html'; });

            } catch (err) {
                carregando(false);
                mostrarErro('Falha de conexão. Tente novamente.');
            }
        });

        // ==========================================
        // OVERLAY DE ENTRADA — as mudas sendo regadas
        // ==========================================
        const MUDA_POSICOES = [8, 24, 40, 56, 72, 88];

        function mudaSVG(delay) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 16 18');
            svg.setAttribute('class', 'entrada-muda');
            svg.setAttribute('aria-hidden', 'true');
            svg.style.animationDelay = `${delay}s`;
            svg.innerHTML = `
                <path d="M8 17 V6" stroke="#EAF1E8" stroke-width="1.4" stroke-linecap="round" fill="none" />
                <ellipse cx="4.6" cy="6.5" rx="3.1" ry="2.1" fill="#8FD4C6" transform="rotate(-35 4.6 6.5)" />
                <ellipse cx="11.4" cy="6.5" rx="3.1" ry="2.1" fill="#8FD4C6" transform="rotate(35 11.4 6.5)" />
                <ellipse cx="5.6" cy="1.8" rx="2.6" ry="1.8" fill="#A8E0D2" transform="rotate(-20 5.6 1.8)" />
                <ellipse cx="10.4" cy="1.8" rx="2.6" ry="1.8" fill="#A8E0D2" transform="rotate(20 10.4 1.8)" />`;
            return svg;
        }

        function mostrarOverlayEntrada(aoTerminar) {
            const overlay = document.createElement('div');
            overlay.className = 'entrada-overlay';

            const cena = document.createElement('div');
            cena.className = 'entrada-cena';

            const solo = document.createElement('div');
            solo.className = 'entrada-solo';
            cena.appendChild(solo);

            MUDA_POSICOES.forEach((pos, i) => {
                const slot = document.createElement('div');
                slot.className = 'entrada-muda-slot';
                slot.style.left = `${pos}%`;
                // cada muda brota quando a marca chega perto dela
                slot.appendChild(mudaSVG(0.35 + i * 0.55));
                cena.appendChild(slot);
            });

            const marca = document.createElement('div');
            marca.className = 'entrada-marca';
            marca.innerHTML = `
                <img src="/assets/larsil-marca.png" alt="" class="entrada-marca-img">
                <svg viewBox="0 0 40 30" class="entrada-pingos-svg" aria-hidden="true">
                    <g class="entrada-pingos">
                        <circle cx="10" cy="4" r="1.6" fill="#6FCF7B" />
                        <circle cx="20" cy="8" r="1.4" fill="#6FCF7B" />
                        <circle cx="30" cy="3" r="1.3" fill="#6FCF7B" />
                    </g>
                </svg>`;
            cena.appendChild(marca);

            const legenda = document.createElement('p');
            legenda.className = 'entrada-legenda';
            legenda.textContent = 'Preparando seu painel…';

            overlay.append(cena, legenda);
            document.body.appendChild(overlay);

            // Segura até a marca completar a passagem regando as mudas (~3,4s).
            setTimeout(aoTerminar, 3400);
        }
    </script>
</body>
</html>
